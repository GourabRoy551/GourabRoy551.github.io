<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gourab Roy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22786a" />
      <stop offset="1" stop-color="#123f37" />
    </linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b47a" stop-opacity="0.85" />
      <stop offset="1" stop-color="#f2b47a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)" />
  <!-- network edges: hidden nodes on the G feed the salient node -->
  <g stroke="#f4efe4" stroke-width="1.6" stroke-linecap="round" opacity="0.45">
    <line x1="15" y1="32" x2="33" y2="32" />
    <line x1="44" y1="20" x2="33" y2="32" />
    <line x1="22" y1="18" x2="33" y2="32" />
  </g>
  <!-- the G: an open arc closed by the bar into the centre -->
  <path d="M44.02 19.98A17 17 0 1 0 49 32H35" fill="none" stroke="#f4efe4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- neurons -->
  <g fill="#f4efe4">
    <circle cx="44.02" cy="19.98" r="4" />
    <circle cx="22" cy="18" r="2.6" />
    <circle cx="15" cy="32" r="2.6" />
  </g>
  <!-- salient node: the attribution hot spot -->
  <circle cx="33" cy="32" r="11" fill="url(#hot)" />
  <circle cx="33" cy="32" r="5" fill="#e8964f" stroke="#f4efe4" stroke-width="2" />
</svg>
